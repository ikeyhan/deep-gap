name: deepgap
description: دیپ گپ — Persian multi-model AI assistant for Android.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Simple, predictable state management
  provider: ^6.1.2
  # Networking
  dio: ^5.7.0
  # Secure token storage
  flutter_secure_storage: ^9.2.2
  # SVG icons & logo (theme-aware, crisp at any size)
  flutter_svg: ^2.0.16
  # Declarative micro-animations for the "animate on select" feel
  flutter_animate: ^4.5.2
  # Markdown / RTL rendering for chat
  flutter_markdown: ^0.7.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

  # ------------------------------------------------------------------
  # FONTS — Yekan Bakh (primary) + Yekan.
  # The app already sets fontFamily: 'YekanBakh' in theme.dart, so as soon as
  # you drop the .ttf files into assets/fonts/ and UNCOMMENT the block below,
  # the whole UI switches to Yekan Bakh. Until then it falls back gracefully
  # (see mobile/README.md and assets/fonts/README.md for where to get them).
  # ------------------------------------------------------------------
  # fonts:
  #   - family: YekanBakh
  #     fonts:
  #       - asset: assets/fonts/YekanBakh-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/YekanBakh-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/YekanBakh-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/YekanBakh-ExtraBold.ttf
  #         weight: 800
  #   - family: Yekan
  #     fonts:
  #       - asset: assets/fonts/Yekan.ttf
