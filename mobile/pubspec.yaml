name: deepgap
description: دیپ گپ — Persian multi-model AI assistant for Android.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State management (Clean Architecture presentation layer)
  flutter_bloc: ^8.1.6
  # Networking
  dio: ^5.7.0
  # DI
  get_it: ^8.0.2
  # Secure token storage
  flutter_secure_storage: ^9.2.2
  # Routing
  go_router: ^14.6.2
  # Markdown / RTL rendering for chat
  flutter_markdown: ^0.7.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
