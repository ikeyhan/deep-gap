[project]
name = "deepgap-backend"
version = "0.1.0"
description = "Deep Gap — multi-model AI platform backend"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is intentional
    "B024",  # AIProvider base intentionally has no @abstractmethod (duck-typed capabilities)
]

[tool.ruff.lint.per-file-ignores]
# Seed data and long comments/model definitions may exceed the line limit.
"app/seed.py" = ["E501"]
"app/models/*.py" = ["E501"]
"app/api/v1/auth.py" = ["E501"]
"app/main.py" = ["E501"]
